---
- name: Ensure that Admin is present with a valid password
  ansible.windows.win_user:
    name: "{{ admin_user }}"
    password: "{{ local_admin_password }}"
    password_never_expires: true
    account_disabled: false
    # admin_user (e.g. goadmin on AWS) must be a local admin so it lands in
    # BUILTIN\Administrators after DC promotion; otherwise ad-parent_domain
    # can't add it to Enterprise Admins ("Insufficient access rights").
    groups:
      - Administrators
    groups_action: add
    state: present

